<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Saloni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #050505;
    --off-white: #f0ece4;
    --warm-grey: #a09a90;
    --accent: #c8a97e;
    --ai-color: #7eb8c8;
    --3d-color: #c8a97e;
    --design-color: #a07ec8;
    --fashion-color: #c87ea0;
    --tint: #c8a97e; /* overridden per category by JS */
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--off-white);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    cursor: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  body.visible { opacity: 1; }

  /* ── CURSOR ── */
  .cursor {
    position: fixed;
    width: 8px; height: 8px;
    background: var(--tint);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s;
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1px solid rgba(200,169,126,0.4);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s;
  }

  /* ── CATEGORY TINT OVERLAY ── */
  .tint-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.03;
  }

  /* ── EXIT BUTTON ── */
  #exit-btn {
    position: fixed;
    top: 2rem;
    right: 2.5rem;
    z-index: 1000;
    font-family: 'Syncopate', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    color: var(--warm-grey);
    cursor: none;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.3s ease;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  #exit-btn:hover { color: var(--off-white); }
  #exit-btn::before {
    content: '';
    display: block;
    width: 20px;
    height: 1px;
    background: currentColor;
    transition: width 0.3s;
  }
  #exit-btn:hover::before { width: 40px; }

  /* ── GLITCH OVERLAY (for exit animation) ── */
  #glitch-overlay {
    position: fixed;
    inset: 0;
    z-index: 9990;
    pointer-events: none;
    opacity: 0;
    background: var(--black);
  }
  #glitch-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 9991;
    pointer-events: none;
    opacity: 0;
  }

  /* ── HERO ── */
  #hero {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }

  #hero-media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.6;
  }

  .hero-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(5,5,5,1) 0%,
      rgba(5,5,5,0.5) 40%,
      transparent 100%
    );
  }

  .hero-content {
    position: relative;
    z-index: 2;
    padding: 4rem 6vw;
    width: 100%;
  }

  .hero-category {
    font-family: 'Syncopate', sans-serif;
    font-size: 0.55rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
  }
  body.visible .hero-category { opacity: 1; transform: translateY(0); }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: 300;
    font-style: italic;
    line-height: 1;
    color: var(--off-white);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
  }
  body.visible .hero-title { opacity: 1; transform: translateY(0); }

  .hero-meta {
    display: flex;
    gap: 3rem;
    margin-top: 1.5rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease 0.5s, transform 0.6s ease 0.5s;
  }
  body.visible .hero-meta { opacity: 1; transform: translateY(0); }

  .hero-meta-item {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .meta-label {
    font-family: 'Syncopate', sans-serif;
    font-size: 0.45rem;
    letter-spacing: 0.35em;
    color: var(--warm-grey);
    text-transform: uppercase;
  }
  .meta-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-weight: 300;
    color: var(--off-white);
  }

  /* ── CONTENT ── */
  .content-wrap {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 6rem 6vw;
  }

  /* Section label */
  .section-label {
    font-family: 'Syncopate', sans-serif;
    font-size: 0.55rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--tint);
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: currentColor;
    opacity: 0.2;
  }

  /* Description */
  .description-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.3rem, 2.5vw, 2rem);
    font-weight: 300;
    line-height: 1.7;
    color: var(--off-white);
    max-width: 800px;
    margin-bottom: 3rem;
  }

  /* Tools pills */
  .tools-wrap {
    margin-top: 2rem;
  }
  .tools-label {
    font-family: 'Syncopate', sans-serif;
    font-size: 0.5rem;
    letter-spacing: 0.35em;
    color: var(--warm-grey);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .tools-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .tool-pill {
    font-family: 'Courier Prime', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--tint);
    border: 1px solid currentColor;
    padding: 0.3rem 0.8rem;
    opacity: 0.7;
    transition: opacity 0.3s;
  }
  .tool-pill:hover { opacity: 1; }

  /* ── PROCESS CHART ── */
  .process-wrap {
    padding: 4rem 6vw 6rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .process-wrap::-webkit-scrollbar { display: none; }

  .process-track {
    display: flex;
    align-items: center;
    gap: 0;
    min-width: max-content;
    padding: 2rem 0;
  }

  .process-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    width: 260px;
    flex-shrink: 0;
  }

  .step-media-wrap {
    width: 100%;
    position: relative;
    overflow: hidden;
    background: #0d0d0d;
  }
  .step-media-wrap.ratio-sq  { aspect-ratio: 1/1; }
  .step-media-wrap.ratio-v   { aspect-ratio: 9/16; }
  .step-media-wrap.ratio-h   { aspect-ratio: 16/9; }

  .step-media {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Placeholder for process steps */
  .step-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.5rem;
    background: #0d0d0d;
    border: 1px dashed rgba(255,255,255,0.08);
  }
  .step-placeholder span {
    font-family: 'Courier Prime', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
    text-align: center;
    padding: 0 1rem;
  }

  .step-label {
    font-family: 'Syncopate', sans-serif;
    font-size: 0.48rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--warm-grey);
    text-align: center;
  }

  /* Arrow between steps */
  .process-arrow {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 1rem;
    flex-shrink: 0;
    margin-bottom: 2.5rem; /* aligns with media, not label */
  }
  .arrow-line {
    width: 40px;
    height: 1px;
    background: linear-gradient(to right, rgba(255,255,255,0.1), rgba(255,255,255,0.3));
  }
  .arrow-head {
    width: 6px;
    height: 6px;
    border-right: 1px solid rgba(255,255,255,0.4);
    border-top: 1px solid rgba(255,255,255,0.4);
    transform: rotate(45deg) translateX(-3px);
    margin-top: -1px;
  }

  /* ── FINAL OUTPUT ── */
  .final-wrap {
    padding: 0 6vw 8rem;
  }
  .final-media-wrap {
    width: 100%;
    position: relative;
    overflow: hidden;
    background: #0d0d0d;
    aspect-ratio: 16/9;
  }
  .final-media {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .final-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    border: 1px dashed rgba(255,255,255,0.08);
  }
  .final-placeholder span {
    font-family: 'Courier Prime', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.15);
    text-transform: uppercase;
  }

  /* ── NEXT PROJECT ── */
  #next-project {
    padding: 4rem 6vw;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: none;
    transition: background 0.3s;
  }
  #next-project:hover { background: rgba(255,255,255,0.02); }
  .next-label {
    font-family: 'Syncopate', sans-serif;
    font-size: 0.5rem;
    letter-spacing: 0.4em;
    color: var(--warm-grey);
    text-transform: uppercase;
  }
  .next-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.5rem, 3vw, 2.5rem);
    font-weight: 300;
    font-style: italic;
    color: var(--off-white);
    margin-top: 0.5rem;
  }
  .next-arrow {
    font-size: 2rem;
    color: var(--warm-grey);
    transition: transform 0.3s, color 0.3s;
  }
  #next-project:hover .next-arrow {
    transform: translateX(10px);
    color: var(--off-white);
  }

  /* ── RESPONSIVE — MOBILE ── */
  @media (max-width: 768px) {

    /* Hide custom cursor */
    .cursor, .cursor-ring { display: none; }
    body { cursor: auto; }
    #exit-btn, #next-project { cursor: pointer; }

    /* Exit button — easier to tap */
    #exit-btn {
      top: 1.2rem;
      right: 1.5rem;
      font-size: 0.6rem;
      padding: 0.6rem 0;
    }

    /* Hero */
    #hero { height: 100svh; }
    .hero-content { padding: 2.5rem 5vw; }
    .hero-title { font-size: clamp(2.5rem, 11vw, 4rem); }
    .hero-meta { flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .meta-value { font-size: 0.9rem; }

    /* Content section */
    .content-wrap { padding: 3.5rem 5vw; }
    .description-text { font-size: clamp(1.1rem, 4.5vw, 1.5rem); margin-bottom: 2rem; }

    /* Process — stays horizontal scroll (works great on mobile) */
    .process-wrap { padding: 2rem 5vw 4rem; }
    .process-step { width: 200px; }

    /* Final output */
    .final-wrap { padding: 0 5vw 5rem; }
    .final-media-wrap { aspect-ratio: 9/16; } /* portrait on mobile feels better */

    /* Next project */
    #next-project { padding: 3rem 5vw; }
    .next-title { font-size: clamp(1.3rem, 6vw, 2rem); }
  }

  @media (max-width: 400px) {
    .hero-title { font-size: clamp(2rem, 12vw, 3rem); }
    .process-step { width: 160px; }
  }

  /* ── YOUTUBE EMBED ── */
  .youtube-wrap {
    width: 100%;
    position: relative;
    aspect-ratio: 16/9;
    background: #000;
    overflow: hidden;
  }
  .youtube-wrap.shorts {
    aspect-ratio: 9/16;
    max-width: 420px;
    margin: 0 auto;
  }
  .youtube-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>

// GLITCH EXIT ANIMATION
// ═══════════════════════════════════════════════════════
const glitchOverlay = document.getElementById('glitch-overlay');
const glitchCanvas = document.getElementById('glitch-canvas');
const glitchCtx = glitchCanvas.getContext('2d');

function resizeCanvas() {
  glitchCanvas.width = window.innerWidth;
  glitchCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function runGlitchExit() {
  let frame = 0;
  const totalFrames = 40;
  glitchCanvas.style.opacity = '1';

  function drawGlitch() {
    const w = glitchCanvas.width;
    const h = glitchCanvas.height;
    glitchCtx.clearRect(0, 0, w, h);

    const progress = frame / totalFrames;

    // Fill base black
    glitchCtx.fillStyle = `rgba(5,5,5,${progress * 0.9})`;
    glitchCtx.fillRect(0, 0, w, h);

    // Glitch slices
    const sliceCount = Math.floor(8 + progress * 20);
    for (let i = 0; i < sliceCount; i++) {
      const y = Math.random() * h;
      const sliceH = Math.random() * 6 + 1;
      const offset = (Math.random() - 0.5) * 80 * progress;
      const alpha = Math.random() * 0.6 * (1 - progress * 0.5);

      // RGB shift slices
      glitchCtx.fillStyle = `rgba(126,184,200,${alpha})`;
      glitchCtx.fillRect(offset, y, w * 0.4, sliceH);
      glitchCtx.fillStyle = `rgba(200,169,126,${alpha})`;
      glitchCtx.fillRect(w * 0.3 + offset, y + 1, w * 0.4, sliceH);
      glitchCtx.fillStyle = `rgba(200,126,160,${alpha * 0.5})`;
      glitchCtx.fillRect(offset * -1, y + 2, w, sliceH * 0.5);
    }

    // Scanlines
    if (progress > 0.3) {
      for (let y = 0; y < h; y += 3) {
        glitchCtx.fillStyle = `rgba(0,0,0,${0.1 * progress})`;
        glitchCtx.fillRect(0, y, w, 1);
      }
    }

    frame++;
    if (frame < totalFrames) {
      requestAnimationFrame(drawGlitch);
    } else {
      // Navigate back
      const target = returnSection
        ? `index.html#${returnSection}`
        : 'index.html';
      window.location.href = target;
    }
  }

  requestAnimationFrame(drawGlitch);
}

document.getElementById('exit-btn').addEventListener('click', runGlitchExit);

// ═══════════════════════════════════════════════════════
// CURSOR
// ═══════════════════════════════════════════════════════
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx = 0, my = 0, rx = 0, ry = 0;

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px';
  cursor.style.top = my + 'px';
});

// Hide cursor on touch devices
const isTouchDevice = () => window.matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouchDevice()) {
  cursor.style.display = 'none';
  ring.style.display = 'none';
  document.body.style.cursor = 'auto';
}

function animateCursor() {
  rx += (mx - rx) * 0.12;
  ry += (my - ry) * 0.12;
  ring.style.left = rx + 'px';
  ring.style.top = ry + 'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();
</script>
