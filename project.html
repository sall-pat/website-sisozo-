<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Saloni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #050505;
    --off-white: #f0ece4;
    --warm-grey: #a09a90;
    --accent: #c8a97e;
    --tint: #c8a97e;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--off-white);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    cursor: none;
    opacity: 0;
    transition: opacity 0.7s ease;
    min-height: 100vh;
  }
  body.visible { opacity: 1; }

  /* ── CURSOR ── */
  .cursor {
    position: fixed; width: 8px; height: 8px;
    background: var(--tint); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s;
  }
  .cursor-ring {
    position: fixed; width: 36px; height: 36px;
    border: 1px solid rgba(200,169,126,0.4); border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s;
  }

  /* ── TINT OVERLAY ── */
  .tint-overlay {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0; opacity: 0.04;
  }

  /* ── GLITCH EXIT ── */
  #glitch-overlay { position: fixed; inset: 0; z-index: 9990; pointer-events: none; opacity: 0; background: var(--black); }
  #glitch-canvas  { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 9991; pointer-events: none; opacity: 0; }

  /* ── EXIT BUTTON ── */
  #exit-btn {
    position: fixed; top: 2rem; left: 2.5rem; z-index: 1000;
    font-family: 'Syncopate', sans-serif; font-size: 0.6rem;
    letter-spacing: 0.4em; color: var(--warm-grey);
    cursor: none; -webkit-tap-highlight-color: transparent;
    transition: color 0.3s;
    display: flex; align-items: center; gap: 0.7rem;
  }
  #exit-btn:hover { color: var(--off-white); }
  #exit-btn::before {
    content: ''; display: block; width: 20px; height: 1px;
    background: currentColor; transition: width 0.3s;
  }
  #exit-btn:hover::before { width: 40px; }

  /* ── MAIN LAYOUT ── */
  .page-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* ── LEFT PANEL ── */
  .left-panel {
    padding: 7rem 4vw 6rem 6vw;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.05);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .left-panel::-webkit-scrollbar { display: none; }

  /* Project number / category */
  .proj-meta-top {
    display: flex; align-items: center; gap: 1.5rem;
    margin-bottom: 3rem;
    opacity: 0; transform: translateY(12px);
    transition: opacity 0.6s ease 0.1s, transform 0.6s ease 0.1s;
  }
  body.visible .proj-meta-top { opacity: 1; transform: translateY(0); }

  .proj-category {
    font-family: 'Syncopate', sans-serif; font-size: 0.5rem;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--tint);
  }
  .proj-category-line { flex: 1; height: 1px; background: var(--tint); opacity: 0.2; }

  /* Title */
  .proj-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 5vw, 5.5rem);
    font-weight: 300; font-style: italic;
    line-height: 1; color: var(--off-white);
    margin-bottom: 1.5rem;
    opacity: 0; transform: translateY(16px);
    transition: opacity 0.8s ease 0.2s, transform 0.8s ease 0.2s;
  }
  body.visible .proj-title { opacity: 1; transform: translateY(0); }

  /* Meta row */
  .proj-meta-row {
    display: flex; gap: 2.5rem; margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.6s ease 0.35s, transform 0.6s ease 0.35s;
    flex-wrap: wrap;
  }
  body.visible .proj-meta-row { opacity: 1; transform: translateY(0); }

  .meta-item { display: flex; flex-direction: column; gap: 0.3rem; }
  .meta-label {
    font-family: 'Syncopate', sans-serif; font-size: 0.42rem;
    letter-spacing: 0.3em; color: var(--warm-grey); text-transform: uppercase;
  }
  .meta-value {
    font-family: 'Cormorant Garamond', serif; font-size: 0.95rem;
    font-weight: 300; color: var(--off-white);
  }

  /* Award badge */
  .award-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: 'Syncopate', sans-serif; font-size: 0.42rem;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--tint);
    border: 1px solid rgba(200,169,126,0.3);
    padding: 0.4rem 0.8rem;
    margin-bottom: 2rem;
    opacity: 0;
    transition: opacity 0.6s ease 0.4s;
  }
  body.visible .award-badge { opacity: 1; }
  .award-badge::before { content: '★'; }

  /* Description */
  .proj-description {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.1rem, 1.6vw, 1.35rem);
    font-weight: 300; line-height: 1.8;
    color: var(--warm-grey); margin-bottom: 2.5rem;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.7s ease 0.45s, transform 0.7s ease 0.45s;
  }
  body.visible .proj-description { opacity: 1; transform: translateY(0); }

  /* Tools */
  .tools-label {
    font-family: 'Syncopate', sans-serif; font-size: 0.46rem;
    letter-spacing: 0.35em; color: var(--warm-grey);
    text-transform: uppercase; margin-bottom: 0.8rem;
  }
  .tools-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 3rem; }
  .tool-pill {
    font-family: 'Courier Prime', monospace; font-size: 0.68rem;
    letter-spacing: 0.08em; color: var(--tint);
    border: 1px solid rgba(200,169,126,0.25);
    padding: 0.25rem 0.7rem; opacity: 0.8;
    transition: opacity 0.3s, border-color 0.3s;
  }
  .tool-pill:hover { opacity: 1; border-color: var(--tint); }

  /* Section label */
  .section-label {
    font-family: 'Syncopate', sans-serif; font-size: 0.48rem;
    letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--tint); margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 1.2rem;
  }
  .section-label::after {
    content: ''; flex: 1; height: 1px;
    background: currentColor; opacity: 0.18;
  }

  /* ── PROCESS (horizontal scroll inside left panel) ── */
  .process-scroll {
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; margin: 0 -1rem;
    padding: 0 1rem 1rem;
  }
  .process-scroll::-webkit-scrollbar { display: none; }

  .process-track {
    display: flex; align-items: flex-start;
    gap: 0; min-width: max-content;
  }

  .process-step {
    display: flex; flex-direction: column;
    align-items: center; gap: 0.7rem; width: 140px; flex-shrink: 0;
  }

  .step-media-wrap {
    width: 100%; position: relative; overflow: hidden; background: #0d0d0d;
  }
  .step-media-wrap.ratio-sq  { aspect-ratio: 1/1; }
  .step-media-wrap.ratio-v   { aspect-ratio: 9/16; }
  .step-media-wrap.ratio-h   { aspect-ratio: 16/9; }

  .step-placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 0.4rem;
    background: #0d0d0d; border: 1px dashed rgba(255,255,255,0.07);
  }
  .step-placeholder span {
    font-family: 'Courier Prime', monospace; font-size: 0.48rem;
    letter-spacing: 0.15em; color: rgba(255,255,255,0.18);
    text-transform: uppercase; text-align: center; padding: 0 0.5rem;
  }

  .step-label {
    font-family: 'Syncopate', sans-serif; font-size: 0.4rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--warm-grey); text-align: center;
  }

  .process-arrow {
    display: flex; align-items: center;
    padding: 0 0.5rem; flex-shrink: 0;
    padding-bottom: 1.5rem;
  }
  .arrow-line { width: 24px; height: 1px; background: rgba(255,255,255,0.15); }
  .arrow-head {
    width: 5px; height: 5px;
    border-right: 1px solid rgba(255,255,255,0.3);
    border-top: 1px solid rgba(255,255,255,0.3);
    transform: rotate(45deg) translateX(-2px);
    margin-top: -1px;
  }

  /* ── NEXT PROJECT ── */
  .next-wrap {
    margin-top: auto; padding-top: 2.5rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    cursor: none; display: flex;
    justify-content: space-between; align-items: center;
    transition: opacity 0.3s;
  }
  .next-wrap:hover { opacity: 0.7; }
  .next-label {
    font-family: 'Syncopate', sans-serif; font-size: 0.44rem;
    letter-spacing: 0.35em; color: var(--warm-grey); text-transform: uppercase;
  }
  .next-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.2rem, 2vw, 1.8rem);
    font-weight: 300; font-style: italic; color: var(--off-white);
    margin-top: 0.3rem;
  }
  .next-arrow {
    font-size: 1.5rem; color: var(--warm-grey);
    transition: transform 0.3s, color 0.3s;
  }
  .next-wrap:hover .next-arrow { transform: translateX(8px); color: var(--off-white); }

  /* ── RIGHT PANEL ── */
  .right-panel {
    position: sticky; top: 0; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #020202;
    overflow: hidden;
  }

  /* Subtle grain on right panel */
  .right-panel::before {
    content: '';
    position: absolute; inset: 0; z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none; opacity: 0.5;
  }

  .final-output-wrap {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 4rem 2rem;
  }

  .final-media-container {
    width: 100%; max-height: 90vh;
    position: relative; background: #080808;
    overflow: hidden;
  }

  /* aspect ratio set by JS */
  .final-media-container iframe,
  .final-media-container video,
  .final-media-container img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; border: none;
  }

  .final-label {
    position: absolute; bottom: -2rem; left: 0;
    font-family: 'Syncopate', sans-serif; font-size: 0.44rem;
    letter-spacing: 0.4em; color: rgba(160,154,144,0.35);
    text-transform: uppercase;
  }

  /* ── MOBILE ── */
  @media (max-width: 768px) {
    .cursor, .cursor-ring { display: none; }
    body { cursor: auto; }
    #exit-btn { cursor: pointer; top: 1rem; left: 1.2rem; font-size: 0.55rem; }

    .page-wrap { grid-template-columns: 1fr; min-height: unset; }

    /* On mobile: right panel goes first (top), left panel below */
    .right-panel {
      position: relative; height: 60vw; min-height: 260px;
      order: -1; top: unset;
    }
    .final-output-wrap { padding: 1.5rem; }

    .left-panel {
      position: relative; height: auto; overflow-y: visible;
      padding: 3rem 5vw 4rem;
      border-right: none;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .proj-title { font-size: clamp(2.5rem, 10vw, 4rem); }
    .proj-meta-row { gap: 1.5rem; }
    .proj-description { font-size: clamp(1rem, 4vw, 1.2rem); }
    .process-step { width: 110px; }
    .next-wrap { cursor: pointer; }
  }

  @media (max-width: 400px) {
    .right-panel { height: 70vw; }
    .process-step { width: 90px; }
  }

  /* Shorts aspect (9:16) */
  .final-media-container.shorts {
    max-width: 320px;
    margin: 0 auto;
  }
</style>
</head>

</div>

const CATEGORY_CONFIG = {
  ai:      { color: '#7eb8c8', tintBg: 'radial-gradient(ellipse at top left, rgba(126,184,200,0.08) 0%, transparent 60%)' },
  '3d':    { color: '#c8a97e', tintBg: 'radial-gradient(ellipse at top left, rgba(200,169,126,0.08) 0%, transparent 60%)' },
  design:  { color: '#a07ec8', tintBg: 'radial-gradient(ellipse at top left, rgba(160,126,200,0.08) 0%, transparent 60%)' },
  fashion: { color: '#c87ea0', tintBg: 'radial-gradient(ellipse at top left, rgba(200,126,160,0.08) 0%, transparent 60%)' },
};

// ── Init ──
const params = new URLSearchParams(window.location.search);
const projectId = params.get('p') || 'unwritten';
const returnSection = params.get('from') || '';
const project = PROJECTS[projectId];
if (!project) { window.location.href = 'index.html'; }

const cat = CATEGORY_CONFIG[project.categoryKey];
document.documentElement.style.setProperty('--tint', cat.color);
document.getElementById('tintOverlay').style.background = cat.tintBg;
document.title = `${project.title} — Saloni`;

// Fill left panel
document.getElementById('proj-category').textContent = project.category;
document.getElementById('proj-title').textContent = project.title;
document.getElementById('meta-year').textContent = project.year;
document.getElementById('meta-type').textContent = project.type;

if (project.award) {
  const badge = document.getElementById('award-badge');
  badge.style.display = 'inline-flex';
  badge.textContent = project.award;
}

document.getElementById('proj-description').textContent = project.description;

// Tools
const toolsList = document.getElementById('tools-list');
project.tools.forEach(tool => {
  const p = document.createElement('div');
  p.className = 'tool-pill'; p.textContent = tool;
  toolsList.appendChild(p);
});

// Process
const track = document.getElementById('process-track');
project.process.forEach((step, i) => {
  const stepEl = document.createElement('div');
  stepEl.className = 'process-step';
  stepEl.innerHTML = `
    <div class="step-media-wrap ${step.ratio}">
      <div class="step-placeholder"><span>${step.placeholder}</span></div>
    </div>
    <div class="step-label">${step.label}</div>
  `;
  track.appendChild(stepEl);
  if (i < project.process.length - 1) {
    const arrow = document.createElement('div');
    arrow.className = 'process-arrow';
    arrow.innerHTML = `<div class="arrow-line"></div><div class="arrow-head"></div>`;
    track.appendChild(arrow);
  }
});

// Final output (right panel)
const container = document.getElementById('final-media-container');
const ratio = project.finalRatio || '16/9';
const isShorts = ratio === '9/16';

container.style.aspectRatio = ratio;
if (isShorts) {
  container.classList.add('shorts');
  container.style.maxWidth = '340px';
}

if (project.finalMedia.type === 'youtube') {
  container.innerHTML = `<iframe src="${project.finalMedia.src}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
} else if (project.finalMedia.type === 'video') {
  container.innerHTML = `<video src="${project.finalMedia.src}" autoplay muted loop playsinline></video>`;
  const vid = container.querySelector('video');
  if (vid) {
    vid.muted = false; vid.volume = 0.85;
    vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
  }
} else {
  container.innerHTML = `<img src="${project.finalMedia.src}" alt="${project.title}">`;
}

// Next project
const nextProject = PROJECTS[project.next];
if (nextProject) {
  document.getElementById('next-title').textContent = nextProject.title;
  document.getElementById('next-wrap').addEventListener('click', () => {
    window.location.href = `project.html?p=${project.next}`;
  });
}

// ── Fade in ──
requestAnimationFrame(() => setTimeout(() => document.body.classList.add('visible'), 50));

// ── Glitch exit ──
const glitchCanvas = document.getElementById('glitch-canvas');
const glitchCtx = glitchCanvas.getContext('2d');
function resizeGlitch() { glitchCanvas.width = window.innerWidth; glitchCanvas.height = window.innerHeight; }
resizeGlitch(); window.addEventListener('resize', resizeGlitch);

function runGlitchExit() {
  let frame = 0; const total = 40;
  glitchCanvas.style.opacity = '1';
  function draw() {
    const w = glitchCanvas.width, h = glitchCanvas.height;
    const p = frame / total;
    glitchCtx.clearRect(0, 0, w, h);
    glitchCtx.fillStyle = `rgba(5,5,5,${p * 0.9})`; glitchCtx.fillRect(0, 0, w, h);
    const slices = Math.floor(8 + p * 20);
    for (let i = 0; i < slices; i++) {
      const y = Math.random() * h, sh = Math.random() * 6 + 1;
      const off = (Math.random() - 0.5) * 80 * p, a = Math.random() * 0.6 * (1 - p * 0.5);
      glitchCtx.fillStyle = `rgba(126,184,200,${a})`; glitchCtx.fillRect(off, y, w * 0.4, sh);
      glitchCtx.fillStyle = `rgba(200,169,126,${a})`; glitchCtx.fillRect(w * 0.3 + off, y + 1, w * 0.4, sh);
    }
    frame++;
    if (frame < total) requestAnimationFrame(draw);
    else window.location.href = returnSection ? `index.html#${returnSection}` : 'index.html';
  }
  requestAnimationFrame(draw);
}
document.getElementById('exit-btn').addEventListener('click', runGlitchExit);

// ── Cursor ──
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
});
const isTouchDevice = () => window.matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouchDevice()) { cursor.style.display = 'none'; ring.style.display = 'none'; document.body.style.cursor = 'auto'; }
function animateCursor() {
  rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();
